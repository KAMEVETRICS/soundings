{% extends "base.html" %}
{% block title %}Insights{% endblock %}
{% block main %}
  <section class="hero">
    <h1>Insights</h1>
  </section>
  {% if not data.ok %}
    <p class="banner warn">{{ data.error }}</p>
  {% else %}
    <section class="insights">
      {% for card in data.insights %}
      <article class="insight {{ card.tone }}">
        <label>{{ card.title }}</label>
        <p>{{ card.body }}</p>
      </article>
      {% else %}
      <article class="insight mute"><label>Empty</label><p>No insights.</p></article>
      {% endfor %}
    </section>
  {% endif %}
{% endblock %}
